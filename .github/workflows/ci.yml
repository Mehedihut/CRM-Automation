name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Server (typecheck + test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JWT_SECRET: ci-only-jwt-secret-not-used-in-prod
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server deps
        working-directory: server
        run: npm ci

      - name: Prisma generate
        working-directory: server
        run: npx prisma generate

      - name: Server typecheck
        working-directory: server
        run: npm run typecheck

      - name: Server tests
        working-directory: server
        run: npm test

  client:
    name: Client (typecheck + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client deps
        working-directory: client
        run: npm ci

      - name: Client typecheck
        working-directory: client
        run: npm run typecheck

      - name: Client tests
        working-directory: client
        run: npm test

      - name: Client build
        working-directory: client
        run: npm run build